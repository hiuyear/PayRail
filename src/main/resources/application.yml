spring:
  application:
    name: ledgerflow

  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerflow
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

# note: there is deliberately no spring.sql.init block here.
# the schema is owned by schema.sql, which docker-compose feeds to postgres via
# docker-entrypoint-initdb.d when the db volume is first created. letting spring run
# it too would execute the file twice against the same database.

server:
  port: 8080

logging:
  level:
    root: INFO
    com.ledgerflow: DEBUG
    org.springframework.web: WARN
